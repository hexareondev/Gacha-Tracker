# Собирает exporter/gacha_export.py в gacha_export.exe и выкладывает его в релиз «exporter».
# Запускается при изменении скрипта и по кнопке. Exe собирается из кода в репозитории
# на серверах GitHub — любой может проверить, из чего он получен.
name: Сборка экспортёра (exe)

on:
  push:
    branches: [main]
    paths:
      - "exporter/gacha_export.py"
      - ".github/workflows/build-exporter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Собрать exe
        run: pyinstaller --onefile --console --name gacha_export exporter/gacha_export.py
      - name: Проверить, что exe запускается
        run: dist\gacha_export.exe --help
      - name: Выложить в релиз
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum dist/gacha_export.exe | cut -d' ' -f1)
          notes="Собрано автоматически из exporter/gacha_export.py (коммит ${GITHUB_SHA::7}).
          SHA-256: \`$sha\`"
          if gh release view exporter >/dev/null 2>&1; then
            gh release edit exporter --notes "$notes"
          else
            gh release create exporter --title "Экспортёр истории круток" --notes "$notes" --latest=false
          fi
          gh release upload exporter dist/gacha_export.exe --clobber
